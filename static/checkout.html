<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanh toán — MyTickets</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
</head>
<body>
<header id="app-header"></header>
<main>
  <h1>Thanh toán</h1>
  <div id="content"><p class="muted">Đang tải...</p></div>
</main>
<script>
requireAuth(false);
renderHeader();

const orderId = new URLSearchParams(window.location.search).get("order_id");
let timer = null;

function render(status, secondsLeft) {
  const content = document.getElementById("content");
  if (status !== "PENDING") {
    content.innerHTML = `
      <div class="card">
        <p>Order #${orderId} — ${statusBadge(status)}</p>
        ${status === "PAID" ? '<p class="success">Thanh toán thành công! Xem vé của bạn.</p><button onclick="location.href=\'/my-tickets.html\'">Vé của tôi</button>' : ""}
        ${status === "FAILED" ? '<p class="error">Order đã thất bại hoặc hết hạn.</p><button onclick="location.href=\'/events.html\'">Về danh sách sự kiện</button>' : ""}
      </div>`;
    if (timer) clearInterval(timer);
    return;
  }
  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");
  content.innerHTML = `
    <div class="card">
      <p class="muted">Order #${orderId}</p>
      <div class="countdown">${mm}:${ss}</div>
      <p class="muted" style="text-align:center;">thời gian giữ chỗ còn lại</p>
      <label>Phương thức thanh toán</label>
      <select id="method">
        <option value="CREDIT_CARD">Thẻ tín dụng</option>
        <option value="MOMO">MoMo</option>
        <option value="BANK_TRANSFER">Chuyển khoản</option>
      </select>
      <div style="margin-top:16px; display:flex; gap:8px;">
        <button onclick="pay()">Thanh toán</button>
        <button class="secondary" onclick="cancelOrder()">Huỷ order</button>
      </div>
      <div id="msg" class="error"></div>
    </div>`;
}

async function tick() {
  try {
    const res = await apiCall(`/orders/${orderId}/countdown`);
    render(res.status, res.seconds_left);
    if (res.status === "PENDING" && res.seconds_left <= 0) {
      setTimeout(tick, 1500);
    }
  } catch (e) {
    document.getElementById("content").innerHTML = `<p class="error">${e.message}</p>`;
    if (timer) clearInterval(timer);
  }
}

async function pay() {
  const method = document.getElementById("method").value;
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    await apiCall(`/orders/${orderId}/pay`, "POST", { method });
    tick();
  } catch (e) {
    msg.textContent = e.message;
    tick();
  }
}

async function cancelOrder() {
  try {
    await apiCall(`/orders/${orderId}/cancel`, "POST");
    tick();
  } catch (e) {
    document.getElementById("msg").textContent = e.message;
  }
}

tick();
timer = setInterval(tick, 5000);
</script>
</body>
</html>
