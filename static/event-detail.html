<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết sự kiện — MyTickets</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
</head>
<body>
<header id="app-header"></header>
<main>
  <div id="content"><p class="muted">Đang tải...</p></div>
</main>
<script>
requireAuth(false);
renderHeader();

const eventId = new URLSearchParams(window.location.search).get("id");
let eventData = null;

async function load() {
  eventData = await apiCall(`/events/${eventId}`);
  const e = eventData;
  const content = document.getElementById("content");
  const canOrder = e.status === "ON_SALE";

  content.innerHTML = `
    <div class="event-banner g${e.event_id % 4}" style="height:220px; border-radius:20px; overflow:hidden; margin-bottom:20px;">${statusBadge(e.status)}</div>
    <h1>${e.event_name}</h1>
    <p class="muted">📍 ${e.venue.venue_name} — ${e.venue.address}</p>
    <p class="muted">🗓 Mở bán: ${fmtDate(e.sale_start)} · Bắt đầu: ${fmtDate(e.start_time)} · Kết thúc: ${fmtDate(e.end_time)}</p>

    <h2>Chọn zone</h2>
    <div class="card form">
      <label>Zone</label>
      <select id="zone_id">
        ${e.zones.map((z) => `<option value="${z.zone_id}" ${z.available === 0 ? "disabled" : ""}>
          ${z.zone_name} — ${fmtMoney(z.price)} — còn ${z.available} vé
        </option>`).join("")}
      </select>
      <label>Số lượng (tối đa 2)</label>
      <input id="quantity" type="number" min="1" max="2" value="1">
      <div style="margin-top:16px;">
        <button onclick="order()" ${canOrder ? "" : "disabled"}>Đặt vé</button>
      </div>
      <div id="msg" class="error"></div>
    </div>
    ${canOrder ? "" : '<p class="muted">Sự kiện hiện không thể đặt vé.</p>'}
  `;
}

async function order() {
  const zone_id = document.getElementById("zone_id").value;
  const quantity = parseInt(document.getElementById("quantity").value, 10);
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const res = await apiCall("/orders", "POST", { event_id: parseInt(eventId), zone_id: parseInt(zone_id), quantity });
    window.location.href = `/checkout.html?order_id=${res.order_id}`;
  } catch (e) {
    msg.textContent = e.message;
  }
}

load();
</script>
</body>
</html>
