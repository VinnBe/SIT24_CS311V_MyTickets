<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vé của tôi — MyTickets</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
</head>
<body>
<header id="app-header"></header>
<main>
  <h1>Vé của tôi</h1>
  <div id="tickets"><p class="muted">Đang tải...</p></div>

  <h2>Lịch sử order</h2>
  <div id="orders"><p class="muted">Đang tải...</p></div>
</main>
<script>
requireAuth(false);
renderHeader();

async function load() {
  const tickets = await apiCall("/my-tickets");
  const tEl = document.getElementById("tickets");
  tEl.innerHTML = tickets.length === 0 ? '<p class="muted">Chưa có vé nào đã mua.</p>' : tickets.map((t) => `
    <div class="card card-row">
      <div>
        <strong>${t.event_name}</strong> — Ghế ${t.seat_row}${t.seat_number}
        <div class="muted">Mã QR: ${t.qr_code}${t.checkin_at ? " · Đã soát vé lúc " + fmtDate(t.checkin_at) : ""}</div>
      </div>
      <div>${fmtMoney(t.ticket_price)}</div>
    </div>`).join("");

  const orders = await apiCall("/my-orders");
  const oEl = document.getElementById("orders");
  oEl.innerHTML = `<table>
    <tr><th>Order</th><th>Số lượng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thời điểm đặt</th></tr>
    ${orders.map((o) => `<tr>
      <td>#${o.order_id}</td><td>${o.ticket_quantity}</td><td>${fmtMoney(o.ticket_amount)}</td>
      <td>${statusBadge(o.order_status)}</td><td>${fmtDate(o.create_at)}</td>
    </tr>`).join("")}
  </table>`;
}
load();
</script>
</body>
</html>
