<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vé của tôi | MyTickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar-wrap">
  <header class="topbar">
    <a class="brand" href="index.html">mytickets</a>
    <nav id="nav" class="nav" aria-label="Điều hướng chính"></nav>
  </header>
</div>
<main class="wrap" id="acctRoot"></main>
<footer class="footer">
  <div class="wrap">mytickets, đồ án môn Nhập môn cơ sở dữ liệu. Mỗi tài khoản mua tối đa 2 vé cho mỗi sự kiện.</div>
</footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/account.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async () => {
  const page = await AccountShell.mount({ active: "tickets", title: "Vé của tôi",
    crumbs: [["Đơn hàng của tôi", "my-orders.html"], ["Vé của tôi"]] });
  if (!page) return;
  page.body.innerHTML = "<h1>Vé của tôi</h1><hr>" +
    '<div class="as__pills" id="pills"></div>' +
    '<div class="as__tabs" role="tablist" id="when"></div><div id="list" aria-live="polite"></div>';

  let orders;
  try { orders = await API.get("/my-tickets"); }
  catch (err) { document.getElementById("list").innerHTML = '<p class="msg msg--error">' + esc(err.message) + "</p>"; return; }

  const STATUS = [["", "Tất cả"], ["PAID", "Thành công"], ["PENDING", "Đang xử lý"], ["FAILED", "Đã hủy"]];
  const WHEN = [["up", "Sắp diễn ra"], ["done", "Đã kết thúc"]];
  let st = "", when = "up";
  const now = new Date();
  const ended = (o) => { const d = parseDt(o.end_time || o.start_time); return d ? d < now : false; };

  function draw() {
    document.getElementById("pills").innerHTML = STATUS.map(([k, t]) =>
      '<button type="button" class="as__pill" data-k="' + k + '" aria-pressed="' + (k === st) + '">' + t + "</button>").join("");
    document.getElementById("when").innerHTML = WHEN.map(([k, t]) =>
      '<button type="button" class="as__tab" role="tab" data-k="' + k + '" aria-selected="' + (k === when) + '">' + t + "</button>").join("");
    const rows = orders.filter((o) => (!st || o.order_status === st) && (when === "done") === ended(o));
    const list = document.getElementById("list");
    if (!rows.length) { list.innerHTML = AccountShell.empty("Bạn chưa có vé nào", ["Mua vé ngay", "index.html"]); return; }
    list.innerHTML = '<div class="ord">' + rows.map((o) =>
      '<article class="ord__card"><div class="ord__top"><p class="ord__name">' + esc(o.event_name) + "</p>" + pill(ORDER_STATUS, o.order_status) + "</div>" +
      '<p class="ord__meta">' + esc(o.zone_name) + " · " + o.ticket_quantity + " vé" + (o.start_time ? " · " + fmtDt(o.start_time) : "") + "</p>" +
      '<div class="ord__foot"><span class="ord__total">' + money(o.total) + "</span>" +
      (o.order_status === "PAID" ? '<button type="button" class="btn btn--small" data-order="' + o.order_id + '">Xem vé</button>' : "") +
      '</div><div class="ord__tickets" id="t' + o.order_id + '" hidden></div></article>').join("") + "</div>";
  }
  draw();

  page.body.addEventListener("click", async (e) => {
    const pl = e.target.closest(".as__pill"), tab = e.target.closest(".as__tab"), view = e.target.closest("[data-order]");
    if (pl) { st = pl.dataset.k; draw(); }
    else if (tab) { when = tab.dataset.k; draw(); }
    else if (view) {
      const box = document.getElementById("t" + view.dataset.order);
      if (!box.hidden) { box.hidden = true; view.textContent = "Xem vé"; return; }
      view.disabled = true;
      try {
        box.innerHTML = renderTickets(await API.get("/orders/" + view.dataset.order));
        box.hidden = false; view.textContent = "Ẩn vé"; drawQRs(box);
      } catch (err) { box.innerHTML = '<p class="msg msg--error">' + esc(err.message) + "</p>"; box.hidden = false; }
      view.disabled = false;
    }
  });
})();
</script>
</body>
</html>
