<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin tài khoản | MyTickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar-wrap">
  <header class="topbar">
    <a class="brand" href="index.html">mytickets</a>
    <nav id="nav" class="nav" aria-label="Điều hướng chính"></nav>
  </header>
</div>
<main class="wrap" id="acctRoot"></main>
<footer class="footer">
  <div class="wrap">mytickets, đồ án môn Nhập môn cơ sở dữ liệu. Mỗi tài khoản mua tối đa 2 vé cho mỗi sự kiện.</div>
</footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/account.js"></script>
<script>
(async () => {
  const page = await AccountShell.mount({ active: "profile", title: "Thông tin tài khoản", crumbs: [["Thông tin tài khoản"]] });
  if (!page) return;
  let p;
  try { p = await API.get("/profile"); }
  catch (err) { page.body.innerHTML = '<p class="msg msg--error">' + esc(err.message) + "</p>"; return; }
  const initial = [...(p.full_name.trim().split(/\s+/).pop() || p.username)][0].toUpperCase();
  page.body.innerHTML =
    '<div class="as__hero"><div class="as__avatar" aria-hidden="true">' + esc(initial) + "</div>" +
    "<strong>" + esc(p.full_name) + '</strong><a href="settings.html">Chỉnh sửa thông tin</a></div>' +
    '<div class="mem"><section><h2>Thẻ thành viên của tôi</h2><p class="muted">Bạn chưa có thẻ thành viên</p></section>' +
    '<section><h2>Đang theo dõi</h2><p class="muted">Bạn chưa có danh sách theo dõi</p></section></div>';
})();
</script>
</body>
</html>
